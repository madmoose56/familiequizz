<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:linear-gradient(160deg,#1e1b4b,#4c1d95 60%,#7e22ce);background-attachment:fixed;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:34px;margin:8px 0 2px;text-align:center}

.sub{text-align:center;opacity:.8;margin:0 0 18px}
.card{background:rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:700;color:#3b0764;background:#fde047;margin:8px 0 0;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.red{background:#fecaca;color:#7f1d1d}
input[type=text],input[type=tel],select,textarea{width:100%;font-size:18px;padding:12px;border-radius:12px;border:0;margin:6px 0;background:#fff;color:#1e1b4b;font-family:inherit}
label.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:18px}
label.chk input{width:22px;height:22px}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{text-align:center;opacity:.7;font-size:14px}
.code{font-size:72px;font-weight:800;letter-spacing:8px;text-align:center;color:#fde047;line-height:1.1}
.url{text-align:center;font-size:18px;word-break:break-all;opacity:.9}
.small{text-align:center;font-size:14px;opacity:.7;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{background:rgba(255,255,255,.2);border-radius:20px;padding:8px 14px;font-size:18px;font-weight:600}
.chip.off{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;font-size:18px;opacity:.9;margin-bottom:8px}
.cd{font-size:34px;font-weight:800;color:#fde047;min-width:60px;text-align:right}
.q{font-size:clamp(24px,5vw,40px);font-weight:800;text-align:center;margin:10px 0 14px;line-height:1.2}
.qimg{display:block;max-width:100%;max-height:38vh;margin:0 auto 14px;border-radius:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:14px;padding:18px 10px;min-height:84px;font-size:clamp(17px,3.6vw,26px);font-weight:700;color:#fff;text-align:left;display:flex;gap:10px;align-items:center;font-family:inherit}
.opt b{background:rgba(0,0,0,.25);border-radius:8px;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt span{flex:1}
.o0{background:#e11d48}.o1{background:#2563eb}.o2{background:#d97706}.o3{background:#059669}
.opt.dim{opacity:.25}
.opt.right{outline:5px solid #fde047}
.opt.mine{outline:5px solid #fff}
.opt:disabled{color:#fff}
.cnt{margin-left:auto;font-size:.8em;opacity:.95}
.big{font-size:44px;font-weight:800;text-align:center;margin:14px 0 4px}
.score{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.15);font-size:20px}
.score:last-child{border:0}
.score b{color:#fde047}
.ok{color:#86efac}.no{color:#fca5a5}
.qrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.qrow span{flex:1}
.qrow img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.x{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 12px;font-size:16px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.7;margin:12px 0 2px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.wrap{max-width:1000px}.qimg{max-height:46vh}.cols{grid-template-columns:1fr 1fr}}
#refreshBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:8;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:24px;line-height:1;padding:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-right:50px}
.tab{border:0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;background:rgba(255,255,255,.15);color:#fff;font-family:inherit}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px;max-height:55vh;overflow:auto}
.gi{position:relative;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;font-size:13px;text-align:center}
.gi img{width:100%;height:110px;object-fit:cover;display:block}
.gi span{display:block;padding:4px}
.gi .x{position:absolute;top:4px;right:4px;padding:2px 8px}
#errBox{display:none;position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;padding:10px;font-size:13px;z-index:9}
</style>

/* ===== Hjelpere ===== */
var app=document.getElementById('app');
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function loadOwn(){try{return JSON.parse(lsGet(OWN_KEY,'[]'))||[]}catch(e){return[]}}
function mkQ(text,right,wrongs,img){
  var opts=shuffle([right].concat(wrongs));
  return {text:text,opts:opts,correct:opts.indexOf(right),img:img||null};
}
window.onerror=function(m,u,l){var b=$('#errBox');b.style.display='block';b.textContent='Feil: '+m+' (linje '+l+')'};

/* ===== Tilstand ===== */

var S={cats:null,own:true,count:10,secs:20};
var H={peer:null,code:'',players:{},phase:'lobby',qs:[],qi:-1,endsAt:0,timer:null,cfg:null,counts:[0,0,0,0],lock:null};
var P={peer:null,conn:null,name:'',code:'',st:null,end:0,chosen:null,joined:false,leaving:false,gen:0,tick:null,status:''};

function go(v){view=v;render()}
function render(){
  var h='';
  if(view==='home')h=vHome();

/* ===== Egne spørsmål ===== */
var editIdx=-1,backTo='home';
function vEditor(){
  var own=loadOwn(),e=editIdx>=0?own[editIdx]:null,w=e?e.w:[];
  var h='<div class="wrap">'+adminTabs('editor')+'<div class="cols">';
  h+='<div class="card"><h2>'+(e?'Rediger spørsmål':'Nytt spørsmål')+'</h2>'+
  '<textarea id="eq" rows="2" placeholder="Spørsmålet, f.eks. Hvem er dette på bildet?">'+esc(e?e.t:'')+'</textarea>'+
  '<input id="er" type="text" placeholder="Riktig svar" value="'+esc(e?e.c:'')+'">'+
  '<input id="ew1" type="text" placeholder="Feil svar 1" value="'+esc(w[0]||'')+'">'+
  '<input id="ew2" type="text" placeholder="Feil svar 2 (valgfritt)" value="'+esc(w[1]||'')+'">'+
  '<input id="ew3" type="text" placeholder="Feil svar 3 (valgfritt)" value="'+esc(w[2]||'')+'">'+
  '<label class="note" style="display:block;text-align:left">Bilde (valgfritt)'+(e&&e.img?' – har bilde fra før, velg nytt for å bytte':'')+'</label><input id="eimg" type="file" accept="image/*">'+
  '<button class="btn" data-a="saveq">'+(e?'Lagre endringer':'Lagre spørsmål')+'</button>'+(e?'<button class="btn ghost" data-a="cancelq">Avbryt</button>':'')+'</div>';
  h+='<div class="card"><h2>Lagrede ('+own.length+')</h2>';
  if(!own.length)h+='<p class="note">Ingen ennå.</p>';
  for(var i=0;i<own.length;i++){
    h+='<div class="qrow">'+(own[i].img?'<img src="'+own[i].img+'" alt="">':'')+'<span>'+esc(own[i].t)+'<br><small>✓ '+esc(own[i].c)+'</small></span><button class="x" data-a="editq" data-i="'+i+'">Rediger</button><button class="x" data-a="delq" data-i="'+i+'">Slett</button></div>';
  }
  return h+'</div><p class="note">Spørsmålene lagres i nettleseren på denne enheten.</p></div></div>';
}
function shrink(file,cb){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){
    var m=560,w=im.width,hh=im.height,s=Math.min(1,m/Math.max(w,hh));
    var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(hh*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',0.6));
  };
  im.onerror=function(){cb(null)};
  im.src=url;
}
function saveQ(){
  var t=$('#eq').value.trim(),c=$('#er').value.trim(),w=[];
  ['#ew1','#ew2','#ew3'].forEach(function(s){var v=$(s).value.trim();if(v)w.push(v)});
  if(!t||!c||!w.length){alert('Skriv spørsmål, riktig svar og minst ett feil svar.');return}
  var f=$('#eimg').files[0];
  function done(img){
    var own=loadOwn();
    if(editIdx>=0&&own[editIdx]){own[editIdx]={t:t,c:c,w:w,img:img||own[editIdx].img||null}}
    else own.push({t:t,c:c,w:w,img:img||null});
    if(!lsSet(OWN_KEY,JSON.stringify(own))){alert('Fikk ikke lagret (for lite plass?). Prøv et mindre bilde.');return}
    editIdx=-1;render();
  }
  if(f)shrink(f,done);else done(null);
}

  '<div class="row"><div><div class="sec">Født fra år</div><input id="tfrom" type="tel" value="1961"></div><div><div class="sec">Født til år</div><input id="tto" type="tel" value="2010"></div></div></div>'+

  '<div class="sec">Hvor kjente</div><select id="tfame">'+selOpts(FAME,1)+'</select>'+
  '<div class="sec">Maks antall</div><select id="tmax"><option>20</option><option selected>40</option><option>60</option></select>'+
  '<button class="btn" data-a="search" id="sbtn">Søk</button><p class="note" id="tstat">Data fra Wikidata. For personer brukes statsborgerskap.</p></div>'+
  '<div><div class="card"><h2>Resultat</h2><div id="tres"><p class="note">Ingen søk ennå.</p></div></div>';
  var ts=loadThemes();
  h+='<div class="card"><h2>Mine temaer ('+ts.length+')</h2>';
  if(!ts.length)h+='<p class="note">Ingen ennå.</p>';
  ts.forEach(function(t,i){h+='<div class="qrow"><span>'+esc(t.name)+'<br><small>'+t.items.length+(t.type==='p'?' personer':' steder')+'</small></span>'+(t.filters?'<button class="x" data-a="rerun" data-i="'+i+'">Kjør søket på nytt</button>':'')+'<button class="x" data-a="deltheme" data-i="'+i+'">Slett</button></div>'});
  return h+'</div></div></div></div>';
}
function renderRes(){
  var el=$('#tres');if(!el)return;
  var old=$('#tname');if(old)TR.suggest=old.value;
  if(!TR.items.length){el.innerHTML='<p class="note">Ingen treff. Prøv å senke «Hvor kjente» eller utvide årene.</p>';return}
  var h='<p class="note" style="text-align:left">Fjern treff med dårlig bilde eller feil person med ✕.</p><div class="grid">';
  TR.items.forEach(function(it,i){h+='<div class="gi"><img src="'+esc(it.img)+'" alt=""><span>'+esc(it.n)+(it.y?'<br><small>f. '+it.y+'</small>':'')+'</span><button class="x" data-a="rmres" data-i="'+i+'">✕</button></div>'});
  var rep=false;loadThemes().forEach(function(t){if(t.id===TR.replaceId)rep=true});
  el.innerHTML=h+'</div><input id="tname" type="text" placeholder="Navn på temaet" value="'+esc(TR.suggest)+'">'+
  (rep?'<button class="btn" data-a="savetheme">Oppdater temaet ('+TR.items.length+')</button><button class="btn ghost" data-a="savenew">Lagre som nytt tema</button>'
      :'<button class="btn" data-a="savetheme">Lagre som tema ('+TR.items.length+')</button>');
}
function wdVals(a){return a.map(function(x){return 'wd:'+x}).join(' ')}
function wdQuery(q,ms){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},ms);
  return fetch('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(q),{signal:ctl.signal}).then(function(r){
    clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
  },function(e){clearTimeout(t);throw e});
}
function runSearch(){
  var type=$('#ttype').value,fame=FAME[$('#tfame').value][1],max=parseInt($('#tmax').value,10),c=CTRY[$('#tcty').value][1];
  var occ=OCC[$('#tocc').value][1],from=parseInt($('#tfrom').value,10)||1900,to=parseInt($('#tto').value,10)||2100,g=$('#tgen').value;
  var types=['Q570116','Q4989906','Q16560','Q2977','Q12280','Q11303','Q23413','Q44539','Q32815','Q16970','Q179700','Q33506','Q839954'];
  /* ett Wikidata-søk per land (hele verden samlet blir for tungt) */
  var groups=c.length?c.map(function(x){return x}):[null];
  function mk(cc){
    var lim=max*2;
    if(type==='p'){
      return 'SELECT ?p ?pLabel ?img ?dob ?g ?sl WHERE { { SELECT ?p ?img ?dob ?g ?sl WHERE {VALUES ?occ {'+wdVals(occ)+'} '+
      (cc?'?p wdt:P27 wd:'+cc+'. ':'')+(g?'VALUES ?g {wd:'+g+'} ':'')+
      '?p wdt:P106 ?occ; wdt:P31 wd:Q5; wdt:P569 ?dob; wdt:P18 ?img; wdt:P21 ?g; wikibase:sitelinks ?sl. FILTER(?sl>='+fame+' && YEAR(?dob)>='+from+' && YEAR(?dob)<='+to+')} ORDER BY DESC(?sl) LIMIT '+lim+
      ' } SERVICE wikibase:label {bd:serviceParam wikibase:language "nb,no,en,mul".}}';
    }
    return 'SELECT ?x ?xLabel ?img ?sl WHERE { { SELECT ?x ?img ?sl WHERE {VALUES ?t {'+wdVals(types)+'} '+
    (cc?'?x wdt:P17 wd:'+cc+'. ':'')+'?x wdt:P31 ?t; wdt:P18 ?img; wikibase:sitelinks ?sl. FILTER(?sl>='+fame+')} ORDER BY DESC(?sl) LIMIT '+(lim*2)+
    ' } SERVICE wikibase:label {bd:serviceParam wikibase:language "nb,no,en,mul".}}';
  }
  var F={type:type,occ:$('#tocc').value,gen:g,from:from,to:to,cty:$('#tcty').value,fame:$('#tfame').value,max:$('#tmax').value};
  var btn=$('#sbtn'),st=$('#tstat'),rows=[],fails=0,done=0,idx=0;
  btn.disabled=true;st.textContent='Søker … (kan ta opptil ett minutt)';
  function finish(){
    rows.sort(function(a,b){return parseInt(b.sl.value,10)-parseInt(a.sl.value,10)});
    var seen={},items=[];
    rows.forEach(function(b){
      var key=(b.p||b.x).value,n=(b.pLabel||b.xLabel||{}).value||'';
      if(seen[key]||!n||/^Q\d+$/.test(n)||items.length>=max)return;
      seen[key]=1;
      var it={n:n,img:b.img.value.replace(/^http:/,'https:')+'?width=500'};
      if(type==='p'){it.y=parseInt(b.dob.value,10);it.g=/Q6581072$/.test(b.g.value)?'f':(/Q6581097$/.test(b.g.value)?'m':'x')}
      items.push(it);
    });
    TR.items=items;TR.type=type;TR.filters=F;
    var s=$('#tstat');
    if(s)s.textContent=items.length+' treff funnet.'+(fails?' ('+fails+' av '+groups.length+' søk fikk tidsavbrudd – prøv igjen for flere treff.)':'');
    var b2=$('#sbtn');if(b2)b2.disabled=false;
    renderRes();
  }
  function next(){
    if(idx>=groups.length)return;
    var cc=groups[idx++];
    wdQuery(mk(cc),70000).then(function(j){rows=rows.concat(j.results.bindings)},function(){fails++}).then(function(){
      done++;
      var s=$('#tstat');if(s&&done<groups.length)s.textContent='Søker … '+done+' av '+groups.length+' ferdig';
      if(done===groups.length)finish();else next();
    });
  }
  for(var k=0;k<Math.min(4,groups.length);k++)next();
}
function rerunTheme(i){
  var t=loadThemes()[i];if(!t||!t.filters)return;
  var f=t.filters,set=function(id,v){var e=$(id);if(e&&v!=null)e.value=v};
  set('#ttype',f.type);$('#tpers').style.display=f.type==='p'?'':'none';
  set('#tocc',f.occ);set('#tgen',f.gen);set('#tfrom',f.from);set('#tto',f.to);set('#tcty',f.cty);set('#tfame',f.fame);set('#tmax',f.max);
  TR.replaceId=t.id;TR.suggest=t.name;
  window.scrollTo(0,0);runSearch();
}
function saveTheme(asNew){
  var name=$('#tname').value.trim();
  if(!name){alert('Gi temaet et navn.');return}
  if(TR.items.length<4){alert('Et tema trenger minst 4 treff.');return}
  var ts=loadThemes(),rep=asNew?null:TR.replaceId,hit=null;
  ts.forEach(function(t){if(t.id===rep)hit=t});
  if(hit){hit.items=TR.items;hit.filters=TR.filters;hit.name=name}
  else ts.push({id:String(Date.now()),name:name,type:TR.type,items:TR.items,filters:TR.filters});
  if(!lsSet('fq-temaer',JSON.stringify(ts))){alert('Fikk ikke lagret (for lite plass?).');return}
  TR.items=[];TR.suggest='';TR.replaceId=null;render();
}

var THEMES=[['skuespillere','Skuespillere (bilde) – vestlige, født etter 1960'],['byer','Byer (bilde av kjent landemerke)']];
function loadThemes(){try{return JSON.parse(lsGet('fq-temaer','[]'))||[]}catch(e){return[]}}
function allThemes(){
  var a=THEMES.slice();
  loadThemes().forEach(function(t){a.push(['u:'+t.id,t.name+' ('+t.items.length+(t.type==='p'?' personer':' steder')+')'])});
  return a;
}
function adminTabs(a){
  var t=[['setup','Start quiz'],['themes','Temaer'],['editor','Egne spørsmål']];
  return '<div class="tabs"><button class="tab" data-a="home">‹ Hjem</button>'+t.map(function(x){
    return '<button class="tab'+(x[0]===a?' on':'')+'" data-a="tab" data-v="'+x[0]+'">'+x[1]+'</button>';
  }).join('')+'</div>';
}
function themeQs(id){
  var out=[],T=window.TEMAER;
  if(id.indexOf('u:')===0){
    var th=loadThemes().filter(function(t){return 'u:'+t.id===id})[0];
    if(!th||th.items.length<4)return out;
    th.items.forEach(function(a){
      var same=th.items.filter(function(b){return b!==a&&(th.type!=='p'||!a.g||a.g==='x'||b.g===a.g)});
      if(same.length<3)same=th.items.filter(function(b){return b!==a});
      var w=shuffle(same).slice(0,3).map(function(b){return b.n});
      var q=mkQ(th.type==='p'?'Hvem er personen på bildet?':'Hva heter dette stedet?',a.n,w,a.img);
      if(a.y)q.info='Født '+a.y;
      out.push(q);
    });
    return out;
  }
  if(!T)return out;
  if(id==='skuespillere'){
    T.skuespillere.forEach(function(a){
      var w=shuffle(T.skuespillere.filter(function(b){return b.g===a.g&&b!==a})).slice(0,3).map(function(b){return b.n});
      var q=mkQ('Hvem er skuespilleren på bildet?',a.n,w,a.img);q.info='Født '+a.y;out.push(q);
    });
  }else if(id==='byer'){
    T.byer.forEach(function(a){
      var w=shuffle(T.byer.filter(function(b){return b!==a})).slice(0,3).map(function(b){return b.c});
      var q=mkQ('Hvilken by ligger dette landemerket i?',a.c,w,a.img);q.info=a.l;out.push(q);
    });
  }
  return out;
}

  var own=loadOwn(),h='<div class="wrap">'+adminTabs('setup');
  h+='<div class="cols"><div class="card"><h2>Temaer</h2><div class="sec">Med bilde</div>';

  h+='<div class="sec">Våre egne</div><label class="chk"><input type="checkbox" id="cown" '+(own.length?'checked':'disabled')+'> Egne spørsmål ('+own.length+')</label>'+
  '<button class="btn ghost" data-a="own">Legg inn / rediger egne spørsmål</button>'+
  '<div class="sec">Vanlige kategorier</div>';
  for(var i=0;i<CATS.length;i++)h+='<label class="chk"><input type="checkbox" id="c'+i+'"> '+esc(CATS[i])+'</label>';
  h+='</div><div><div class="card"><div class="row"><div><h2>Antall spørsmål</h2><select id="scount">'+[10,15,20,25,30].map(function(n){return '<option'+(n===20?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'+
  '<div><h2>Sekunder</h2><select id="ssecs">'+[10,15,20,30].map(function(n){return '<option'+(n===20?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div></div>'+
  '<p class="note">Spørsmålene fordeles jevnt mellom temaene du velger.</p></div>'+

function buildQs(cfg){
  var lists=[];
  (cfg.themes||[]).forEach(function(t){lists.push(shuffle(themeQs(t)))});
  if(cfg.own)lists.push(shuffle(loadOwn()).map(function(o){return mkQ(o.t,o.c,o.w,o.img)}));
  cfg.cats.forEach(function(c){lists.push(shuffle(BANK[c]).map(function(r){return mkQ(r[0],r[1],r.slice(2))}))});
  var qs=[];
  while(qs.length<cfg.count&&lists.some(function(l){return l.length})){
    lists.forEach(function(l){if(l.length&&qs.length<cfg.count)qs.push(l.shift())});
  }
  return shuffle(qs);
}

function startHost(){
  if(typeof Peer==='undefined'){alert('Fikk ikke lastet PeerJS. Sjekk nettet og prøv igjen.');return}
  var cats=[],themes=[];
  for(var i=0;i<CATS.length;i++)if($('#c'+i).checked)cats.push(CATS[i]);
  allThemes().forEach(function(t,i){if($('#t'+i).checked)themes.push(t[0])});
  var own=$('#cown').checked&&!$('#cown').disabled;
  H.cfg={cats:cats,themes:themes,own:own,count:parseInt($('#scount').value,10),secs:parseInt($('#ssecs').value,10)};
  H.qs=buildQs(H.cfg);
  if(!H.qs.length){alert('Velg minst ett tema.');return}
  H.players={};
  $('#openbtn').disabled=true;$('#openbtn').textContent='Åpner rom…';
  openRoom(0);
}
function openRoom(tries){
  var code=String(1000+Math.floor(Math.random()*9000));
  var p=new Peer('familiequizz-'+code);
  p.on('open',function(){
    H.peer=p;H.code=code;H.phase='lobby';H.qi=-1;
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){H.lock=l},function(){})}catch(e){}
    go('host');
  });
  p.on('error',function(err){
    if(err.type==='unavailable-id'&&tries<5){try{p.destroy()}catch(e){}openRoom(tries+1)}
    else if(!H.peer){alert('Kunne ikke åpne rom ('+err.type+'). Sjekk nettet.');go('setup')}
  });
  p.on('connection',function(conn){
    conn.on('data',function(m){hostMsg(conn,m)});
    conn.on('close',function(){hostDrop(conn)});
    conn.on('error',function(){hostDrop(conn)});
  });
  p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
}
function ranked(){var a=[];for(var k in H.players)a.push(H.players[k]);a.sort(function(x,y){return y.score-x.score||(x.name<y.name?-1:1)});return a}
function onlineList(){return ranked().filter(function(p){return p.online})}
function allAnswered(){var o=onlineList();if(!o.length)return false;return o.every(function(p){return !!p.ans})}
function answeredCount(){var n=0,o=onlineList();o.forEach(function(p){if(p.ans)n++});return n+' av '+o.length+' har svart'}
function hostMsg(conn,m){
  if(!m)return;
  if(m.t==='join'){
    var name=String(m.name||'').trim().slice(0,14);
    if(!name){conn.send({t:'err',m:'Skriv et navn.'});return}
    var p=H.players[name];
    if(p&&p.online&&p.conn!==conn){conn.send({t:'err',m:'Navnet er allerede i bruk.'});return}
    if(!p)p=H.players[name]={name:name,score:0,ans:null,last:null};
    p.conn=conn;p.online=true;conn._name=name;
    conn.send({t:'joined',name:name});
    sendTo(p);refreshHost();
  }else if(m.t==='ans'){
    var pl=H.players[conn._name];
    if(!pl||H.phase!=='q'||pl.ans)return;
    var c=m.c|0,q=H.qs[H.qi],left=Math.max(0,H.endsAt-Date.now()),ok=c===q.correct;
    pl.ans={c:c,ok:ok,gain:ok?500+Math.round(500*left/(H.cfg.secs*1000)):0};
    conn.send({t:'a',c:c});
    refreshHost();
    if(allAnswered())hostReveal();
  }
}
function hostDrop(conn){
  var p=H.players[conn._name];
  if(p&&p.conn===conn){p.online=false;refreshHost();if(H.phase==='q'&&allAnswered())hostReveal()}
}
function stateFor(p){
  var q=H.qs[H.qi],r=ranked();
  function top(n){return r.slice(0,n).map(function(x){return {name:x.name,score:x.score}})}
  if(H.phase==='lobby')return {t:'s',ph:'lobby',n:r.length};
  if(H.phase==='q')return {t:'s',ph:'q',i:H.qi+1,n:H.qs.length,text:q.text,opts:q.opts,img:q.img,left:Math.max(0,H.endsAt-Date.now()),ans:p.ans?p.ans.c:null};
  if(H.phase==='reveal'){var l=p.last||{c:null,gain:0,ok:false};
    return {t:'s',ph:'reveal',i:H.qi+1,n:H.qs.length,text:q.text,opts:q.opts,correct:q.correct,info:q.info||'',you:{c:l.c,ok:l.ok,gain:l.gain,score:p.score,rank:r.indexOf(p)+1},top:top(5)}}
  return {t:'s',ph:'end',you:{score:p.score,rank:r.indexOf(p)+1},top:top(50)};
}
function sendTo(p){if(p.conn&&p.online){try{p.conn.send(stateFor(p))}catch(e){}}}
function broadcast(){for(var k in H.players)sendTo(H.players[k])}
function refreshHost(){
  if(view!=='host')return;
  if(H.phase==='q'){var e=$('#cnt');if(e)e.textContent=answeredCount()}else render();
}
function hostNext(){
  if(H.timer){clearInterval(H.timer);H.timer=null}
  if(H.qi+1>=H.qs.length){H.phase='end'}
  else{
    H.qi++;H.phase='q';H.endsAt=Date.now()+H.cfg.secs*1000;
    for(var k in H.players)H.players[k].ans=null;
    H.timer=setInterval(function(){
      var l=Math.max(0,H.endsAt-Date.now()),e=$('#cd');
      if(e)e.textContent=Math.ceil(l/1000);
      if(l<=0)hostReveal();
    },250);
  }
  broadcast();render();
}
function hostReveal(){
  if(H.phase!=='q')return;
  if(H.timer){clearInterval(H.timer);H.timer=null}
  H.phase='reveal';H.counts=[0,0,0,0];
  for(var k in H.players){
    var p=H.players[k];
    p.last=p.ans||{c:null,ok:false,gain:0};
    p.score+=p.last.gain;
    if(p.last.c!=null&&p.last.c>=0&&p.last.c<4)H.counts[p.last.c]++;
  }
  broadcast();render();
}
function hostAgain(){
  for(var k in H.players){H.players[k].score=0;H.players[k].ans=null;H.players[k].last=null}
  H.qs=buildQs(H.cfg);H.qi=-1;H.phase='lobby';broadcast();render();
}
function hostClose(){
  if(H.timer){clearInterval(H.timer);H.timer=null}
  try{if(H.peer)H.peer.destroy()}catch(e){}
  try{if(H.lock)H.lock.release()}catch(e){}
  H.peer=null;H.players={};H.phase='lobby';go('home');
}
function optsHtml(q,mode){

/* ===== Spiller ===== */
function doJoin(){
  var code=$('#jcode').value.trim(),name=$('#jname').value.trim();
  if(typeof Peer==='undefined'){alert('Fikk ikke lastet PeerJS. Sjekk nettet og prøv igjen.');return}
  if(!/^\d{4}$/.test(code)){alert('Koden har 4 siffer.');return}
  if(!name){alert('Skriv navnet ditt.');return}
  lsSet('fq-navn',name);
  P.code=code;P.name=name;P.st=null;P.chosen=null;P.joined=false;P.leaving=false;P.status='Kobler til…';
  view='player';render();
  connectPlayer();
}
function stopPlayer(){
  P.gen++;
  if(P.tick){clearInterval(P.tick);P.tick=null}
  try{if(P.conn)P.conn.close()}catch(e){}
  try{if(P.peer)P.peer.destroy()}catch(e){}
  P.conn=null;P.peer=null;
}
function leavePlayer(msg){
  P.leaving=true;stopPlayer();
  if(msg)alert(msg);
  go('home');
}
function connectPlayer(){
  if(P.leaving)return;
  stopPlayer();
  var gen=P.gen,done=false,timeout;
  function bad(msg){
    if(done||gen!==P.gen||P.leaving)return;done=true;clearTimeout(timeout);
    if(!P.joined){leavePlayer(msg)}
    else{P.status='Mistet forbindelsen – prøver igjen…';P.st=P.st;render();setTimeout(connectPlayer,3000)}
  }
  var peer=new Peer();P.peer=peer;
  timeout=setTimeout(function(){bad('Fant ikke rommet. Sjekk koden, og at verten har appen åpen.')},12000);
  peer.on('error',function(e){bad(e.type==='peer-unavailable'?'Fant ikke rommet. Sjekk koden, og at verten har appen åpen.':'Tilkoblingsfeil ('+e.type+').')});
  peer.on('open',function(){
    var c=peer.connect('familiequizz-'+P.code,{reliable:true});P.conn=c;
    c.on('open',function(){clearTimeout(timeout);c.send({t:'join',name:P.name})});
    c.on('data',function(m){if(gen===P.gen)playerMsg(m)});
    c.on('close',function(){bad('Mistet forbindelsen.')});
    c.on('error',function(){bad('Tilkoblingsfeil.')});
  });
}
function playerMsg(m){
  if(!m)return;
  if(m.t==='err'){leavePlayer(m.m);return}
  if(m.t==='joined'){P.joined=true;P.status='';return}
  if(m.t==='a'){P.chosen=m.c;render();return}
  if(m.t==='s'){
    P.st=m;P.status='';
    if(m.ph==='q'){
      P.end=Date.now()+m.left;P.chosen=m.ans;
      if(P.tick)clearInterval(P.tick);
      P.tick=setInterval(function(){
        var e=$('#pcd');if(e)e.textContent=Math.ceil(Math.max(0,P.end-Date.now())/1000);
      },250);
    }else if(P.tick){clearInterval(P.tick);P.tick=null}
    render();
  }
}
function playerAnswer(i){
  if(P.chosen!=null||!P.st||P.st.ph!=='q')return;
  P.chosen=i;
  try{P.conn.send({t:'ans',c:i})}catch(e){}
  render();
}
function vPlayer(){
  var s=P.st,h='<div class="wrap">';
  if(P.status)h+='<p class="note">'+esc(P.status)+'</p>';
  if(!s||s.ph==='lobby'){
    h+='<h1>Hei, '+esc(P.name)+'!</h1><p class="sub">'+(s?'Du er med. Venter på at verten starter quizen…':'Kobler til…')+'</p>'+
    (s?'<p class="note">'+s.n+' spiller'+(s.n===1?'':'e')+' i rommet</p>':'');
  }else if(s.ph==='q'){
    h+='<div class="top"><span>Spørsmål '+s.i+' av '+s.n+'</span><span class="cd" id="pcd">'+Math.ceil(Math.max(0,P.end-Date.now())/1000)+'</span></div>'+
    '<div class="q" style="font-size:22px">'+esc(s.text)+'</div>'+(s.img?'<img class="qimg" style="max-height:24vh" src="'+s.img+'" alt="">':'')+'<div class="opts">';
    for(var i=0;i<s.opts.length;i++){
      h+='<button class="opt o'+i+(P.chosen===i?' mine':(P.chosen!=null?' dim':''))+'" data-a="ans" data-i="'+i+'"'+(P.chosen!=null?' disabled':'')+'><b>'+LETT[i]+'</b><span>'+esc(s.opts[i])+'</span></button>';
    }
    h+='</div>'+(P.chosen!=null?'<p class="big" style="font-size:22px">Svar sendt ✓</p><p class="note">Venter på de andre…</p>':'');
  }else if(s.ph==='reveal'){
    var y=s.you;
    h+='<div class="big '+(y.ok?'ok':'no')+'">'+(y.c==null?'⏱ Ikke svart':(y.ok?'✓ Riktig!':'✗ Feil'))+'</div>'+
    '<p class="sub" style="font-size:22px">'+(y.gain?'+'+y.gain+' poeng':'0 poeng')+'</p>'+
    '<div class="card"><p class="note" style="margin:0">Riktig svar</p><div class="q" style="margin:4px 0 0;font-size:24px">'+LETT[s.correct]+'. '+esc(s.opts[s.correct])+'</div>'+(s.info?'<p class="note" style="margin:4px 0 0">'+esc(s.info)+'</p>':'')+'</div>'+
    '<div class="card"><h2>Du er nr. '+y.rank+' med '+y.score+' poeng</h2>'+scoreRows(s.top,5)+'</div>'+
    '<p class="note">Venter på neste spørsmål…</p>';
  }else{
    h+='<h1>'+(s.you.rank===1?'🏆 Du vant!':'Ferdig!')+'</h1><p class="sub">Du ble nr. '+s.you.rank+' med '+s.you.score+' poeng</p>'+
    '<div class="card">'+scoreRows(s.top,50)+'</div>';
  }
  return h+'<button class="btn ghost" data-a="leave" style="margin-top:20px">Forlat quizen</button></div>';
}

/* ===== Klikk ===== */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-a'),i=parseInt(b.getAttribute('data-i'),10);
  if(a==='join')doJoin();
  else if(a==='new')go('setup');
  else if(a==='own'){backTo=view;editIdx=-1;go('editor')}
  else if(a==='back')go(backTo)
  else if(a==='tab'){editIdx=-1;go(b.getAttribute('data-v'))}
  else if(a==='search'){TR.replaceId=null;runSearch()}
  else if(a==='rerun')rerunTheme(i);
  else if(a==='savenew')saveTheme(true);
  else if(a==='rmres'){TR.items.splice(i,1);renderRes()}
  else if(a==='savetheme')saveTheme();
  else if(a==='deltheme'){if(confirm('Slette temaet?')){var ts=loadThemes();ts.splice(i,1);lsSet('fq-temaer',JSON.stringify(ts));render()}}
  else if(a==='editq'){editIdx=i;render()}
  else if(a==='cancelq'){editIdx=-1;render()}
  else if(a==='home')go('home');
  else if(a==='saveq')saveQ();
  else if(a==='delq'){if(confirm('Slette spørsmålet?')){var o=loadOwn();o.splice(i,1);lsSet(OWN_KEY,JSON.stringify(o));editIdx=-1;render()}}
  else if(a==='open')startHost();
  else if(a==='start')hostNext();
  else if(a==='skip')hostReveal();
  else if(a==='next')hostNext();
  else if(a==='again')hostAgain();
  else if(a==='close'){if(confirm('Avslutte quizen for alle?'))hostClose()}
  else if(a==='share'){
    var u=location.href.split('?')[0].split('#')[0]+'?kode='+H.code;
    if(navigator.share)navigator.share({title:'Familiequizz',text:'Bli med i quizen! Kode: '+H.code,url:u}).catch(function(){});
    else prompt('Kopier lenken:',u);
  }
  else if(a==='ans')playerAnswer(i);
  else if(a==='leave'){if(confirm('Forlate quizen?'))leavePlayer()}
});

app.addEventListener('change',function(e){
  if(e.target.id==='ttype'){$('#tpers').style.display=e.target.value==='p'?'':'none';$('#tfame').value=e.target.value==='p'?'1':'2'}
});
$('#refreshBtn').addEventListener('click',function(){
  if((H.peer||P.joined)&&!confirm('Oppdatere appen? Du blir koblet fra quizen og må bli med igjen.'))return;
  var go2=function(){location.reload()};
  try{
    var jobs=[];
    if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));
    if(window.caches)jobs.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));
    Promise.all(jobs).then(go2,go2);
  }catch(e){go2()}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
</script>
