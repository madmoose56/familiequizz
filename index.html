<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:linear-gradient(160deg,#1e1b4b,#4c1d95 60%,#7e22ce);background-attachment:fixed;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:34px;margin:8px 0 2px;text-align:center}
h2{font-size:18px;margin:0 0 10px}
.sub{text-align:center;opacity:.8;margin:0 0 18px}
.card{background:rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-bottom:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:700;color:#3b0764;background:#fde047;margin:8px 0 0;cursor:pointer}
.btn:disabled{opacity:.4}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.red{background:#fecaca;color:#7f1d1d}
input[type=text],input[type=tel],select,textarea{width:100%;font-size:18px;padding:12px;border-radius:12px;border:0;margin:6px 0;background:#fff;color:#1e1b4b;font-family:inherit}
label.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:18px}
label.chk input{width:22px;height:22px}
.row{display:flex;gap:10px}.row>*{flex:1}
.note{text-align:center;opacity:.7;font-size:14px}
.code{font-size:72px;font-weight:800;letter-spacing:8px;text-align:center;color:#fde047;line-height:1.1}
.url{text-align:center;font-size:18px;word-break:break-all;opacity:.9}
.small{text-align:center;font-size:14px;opacity:.7;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{background:rgba(255,255,255,.2);border-radius:20px;padding:8px 14px;font-size:18px;font-weight:600}
.chip.off{opacity:.4}
.top{display:flex;justify-content:space-between;align-items:center;font-size:18px;opacity:.9;margin-bottom:8px}
.cd{font-size:34px;font-weight:800;color:#fde047;min-width:60px;text-align:right}
.q{font-size:clamp(24px,5vw,40px);font-weight:800;text-align:center;margin:10px 0 14px;line-height:1.2}
.qimg{display:block;max-width:100%;max-height:38vh;margin:0 auto 14px;border-radius:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:14px;padding:18px 10px;min-height:84px;font-size:clamp(17px,3.6vw,26px);font-weight:700;color:#fff;text-align:left;display:flex;gap:10px;align-items:center;font-family:inherit}
.opt b{background:rgba(0,0,0,.25);border-radius:8px;min-width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt span{flex:1}
.o0{background:#e11d48}.o1{background:#2563eb}.o2{background:#d97706}.o3{background:#059669}
.opt.dim{opacity:.25}
.opt.right{outline:5px solid #fde047}
.opt.mine{outline:5px solid #fff}
.opt:disabled{color:#fff}
.cnt{margin-left:auto;font-size:.8em;opacity:.95}
.big{font-size:44px;font-weight:800;text-align:center;margin:14px 0 4px}
.score{display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.15);font-size:20px}
.score:last-child{border:0}
.score b{color:#fde047}
.ok{color:#86efac}.no{color:#fca5a5}
.qrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.15)}
.qrow span{flex:1}
.qrow img{width:40px;height:40px;object-fit:cover;border-radius:8px}
.x{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 12px;font-size:16px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.7;margin:12px 0 2px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.wrap{max-width:1000px}.qimg{max-height:46vh}.cols{grid-template-columns:1fr 1fr}}
#refreshBtn{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:8;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:24px;line-height:1;padding:0}
.buzz{display:block;width:min(72vw,300px);height:min(72vw,300px);margin:18px auto;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fca5a5,#ef4444 55%,#b91c1c);color:#fff;font-size:44px;font-weight:800;line-height:1.1;box-shadow:0 10px 0 #7f1d1d,0 14px 30px rgba(0,0,0,.4);font-family:inherit;touch-action:manipulation}
.buzz:active{transform:translateY(8px);box-shadow:0 2px 0 #7f1d1d}
.buzzmsg{background:rgba(255,255,255,.15);border-radius:18px;padding:26px 14px;margin:18px 0;text-align:center;font-size:24px;font-weight:800}
.buzzmsg.win{background:rgba(34,197,94,.45);font-size:30px}
.buzzmsg small{font-size:16px;font-weight:600;opacity:.9}
.wrap.wide{max-width:1500px}
.gl{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.gl .mid{order:-1}
@media(min-width:900px){.gl{grid-template-columns:minmax(150px,.7fr) minmax(0,3fr) minmax(150px,.7fr)}.gl .mid{order:0}}
.gl>.card{padding:8px 10px;margin:0;border-radius:12px}
.gl>.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.75;margin:0 0 4px}
.gl>.card .score{padding:3px 2px;font-size:15px}
.gl>div>.card{padding:8px 10px;margin:0;border-radius:12px}
.gl>div>.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.75;margin:0 0 4px}
.gl>div>.card .score{padding:3px 2px;font-size:15px}
.wrap.wide .q{margin:4px 0 10px}
/* TV / stor skjerm: alt på vertsskjermen skalerer med skjermbredden (vw), 16:9 */
@media(min-width:900px){
.wrap.wide{max-width:none;padding:1.2vw 2vw}
.wrap.wide .top{font-size:1.5vw;margin-bottom:.4vw}
.wrap.wide .cd{font-size:3.4vw;min-width:5vw}
.wrap.wide .q{font-size:3.3vw;margin:.2vw 0 1vw}
.wrap.wide .q.long{font-size:2.2vw}
.wrap.wide .gl{grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:1.6vw}
.wrap.wide .gl>.card,.wrap.wide .gl>div>.card{padding:1vw 1.2vw;border-radius:1.2vw}
.wrap.wide .gl .card h2{font-size:1.3vw;margin-bottom:.5vw;letter-spacing:.1vw}
.wrap.wide .gl .score{font-size:1.9vw;padding:.45vw .2vw}
.wrap.wide .qimg{max-height:40vh;border-radius:1.2vw;margin-bottom:1vw}
.wrap.wide .opts{gap:1vw}
.wrap.wide .opt{font-size:2.3vw;min-height:7.2vw;padding:1vw 1.4vw;border-radius:1.2vw;gap:1vw}
.wrap.wide .opt b{min-width:3.4vw;height:3.4vw;font-size:2.3vw;border-radius:.8vw}
.wrap.wide .btn{font-size:1.4vw;padding:1vw;border-radius:1vw;margin-top:.8vw}
.wrap.wide .small,.wrap.wide .note{font-size:1.3vw}
.wrap.wide .sub{font-size:2vw!important}
.wrap.wide .big{font-size:2.4vw}
.wrap.wide .row{gap:1vw}
}
.ver{text-align:center;font-size:12px;opacity:.55;margin:18px 0 14px}
.btn.ok{background:#22c55e;color:#04290f}
.btn.sm{font-size:14px;padding:9px;margin:6px 0 0}
.btn.big{font-size:24px;padding:24px;margin-top:12px}
details.dt{border-top:1px solid rgba(255,255,255,.18);padding:2px 0}
details.dt>summary{cursor:pointer;list-style:none;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:12px 0;opacity:.95}
details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::before{content:'▸';display:inline-block;width:1.2em;transition:transform .15s}
details.dt[open]>summary::before{transform:rotate(90deg)}
.cnt2{font-weight:400;opacity:.75;text-transform:none;letter-spacing:0;margin-left:4px}
.ansbox{background:rgba(34,197,94,.25)}
.ansbox .a{font-size:28px;font-weight:800;color:#bbf7d0;margin-top:2px}
.infopg{background:rgba(255,255,255,.12);border-radius:16px;padding:16px;text-align:left}
.infopg .ia{font-size:26px;font-weight:800;color:#86efac;margin-bottom:8px}
.infopg .itx{font-size:20px;line-height:1.4;margin-bottom:10px}
.igal{display:grid;gap:10px;grid-template-columns:1fr 1fr}.igal.n1{grid-template-columns:1fr}.igal img{width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:rgba(0,0,0,.25)}
@media(min-width:900px){
.wrap.wide .infopg{border-radius:1.2vw;padding:1.2vw 1.6vw}
.wrap.wide .infopg .ia{font-size:3vw;margin-bottom:.6vw}
.wrap.wide .infopg .itx{font-size:1.9vw;margin-bottom:.8vw}
.wrap.wide .igal{gap:1vw}.wrap.wide .igal img{max-height:24vh;border-radius:1vw}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:1.6vw;align-items:end;margin-top:1.2vw}
.ctl .tabs{margin:0}
.wrap.wide .mid>.card{padding:.7vw 1vw!important;margin:0 0 .8vw!important}
.wrap.wide .tab{font-size:1.4vw;padding:.7vw 1.2vw;border-radius:.8vw}
.wrap.wide .sec{font-size:1.2vw}
.wrap.tvw{max-width:none;width:64vw;padding:1vw 0}
.tvw h1{font-size:5vw}
.tvw .code{font-size:11vw;letter-spacing:1vw}
.tvw .url{font-size:2.2vw}
.tvw .small{font-size:1.8vw}
.tvw .chips{gap:1vw}
.tvw .chip{font-size:2.2vw;padding:.7vw 1.6vw;border-radius:3vw}
.tvw .btn{font-size:2.2vw;padding:1.3vw;border-radius:1.4vw}
.tvw .card{padding:2vw;border-radius:2vw}
.tvw .score{font-size:2.6vw;padding:.8vw .3vw}
.tvw .tab{font-size:1.8vw;padding:1vw 1.6vw}
.tvw .sec{font-size:1.4vw}
}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding-right:50px}
.tab{border:0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700;background:rgba(255,255,255,.15);color:#fff;font-family:inherit}
.tab.on{background:#fde047;color:#3b0764}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:10px;max-height:55vh;overflow:auto}
.gi{position:relative;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;font-size:13px;text-align:center}
.gi img{width:100%;height:110px;object-fit:cover;display:block}
.gi span{display:block;padding:4px;max-height:5.4em;overflow:hidden}
.gi .clue{height:110px;padding:6px;font-size:11px;overflow:hidden;opacity:.85;text-align:left}
.q.long{font-size:20px}
.gi .x{position:absolute;top:4px;right:4px;padding:2px 8px}
#errBox{display:none;position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;padding:10px;font-size:13px;z-index:9}
</style>
</head>
<body>

<button id="refreshBtn" aria-label="Oppdater appen" title="Oppdater appen">&#x21BB;</button>
<div id="errBox"></div>
<script>

['Hvem ble Norges konge etter selvstendigheten i 1905?','Haakon VII','Olav V','Harald V','Oscar II'],
['Hvilket år ble Norges grunnlov vedtatt på Eidsvoll?','1814','1905','1750','1864'],
['Hvilket folk er kjent for å seile i langskip?','Vikingene','Romerne','Grekerne','Egypterne'],
['Hvem var den første personen på månen?','Neil Armstrong','Buzz Aldrin','Juri Gagarin','John Glenn'],
['Hvilket år falt Berlinmuren?','1989','1961','1975','2001'],
['Hvilket land bygde pyramidene i Giza?','Egypt','Mexico','Hellas','Peru']],
'Natur og vitenskap':[

['Hvor mange ben har en edderkopp?','8','6','10','4'],
['Hvor mange planeter har solsystemet vårt?','8','9','7','10'],
['Hvilken gass trenger vi for å puste?','Oksygen','Nitrogen','Helium','Karbondioksid'],
['Hva kalles en baby-frosk?','Rumpetroll','Larve','Kylling','Yngel'],
['Hvilket dyr er raskest på land?','Gepard','Løve','Hest','Antilope'],
['Hva er verdens største landdyr?','Elefant','Neshorn','Flodhest','Sjiraff'],
['Hva er det kjemiske symbolet for gull?','Au','Ag','Go','Gd']],
'Mat og drikke':[
['Hvilket land kommer pizza opprinnelig fra?','Italia','Frankrike','USA','Hellas'],
['Hva er hovedingrediensen i guacamole?','Avokado','Tomat','Agurk','Lime'],
['Hva lages ost av?','Melk','Egg','Mel','Fisk'],
['Hvilket land kommer sushi fra?','Japan','Kina','Thailand','Korea'],
['Hva er brunost hovedsakelig laget av?','Myse','Kakao','Karamell','Soyabønner'],
['Hva heter det lange, tynne franske brødet?','Baguette','Croissant','Focaccia','Ciabatta'],
['Hva slags frukt er «Granny Smith»?','Eple','Pære','Drue','Plomme'],
['Hva er lutefisk laget av?','Tørrfisk','Laks','Sild','Reker']]
};
var CATS=Object.keys(BANK);
var LETT=['A','B','C','D'];
var OWN_KEY='fq-egne';

/* ===== Hjelpere ===== */
var app=document.getElementById('app');
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function loadOwn(){try{return JSON.parse(lsGet(OWN_KEY,'[]'))||[]}catch(e){return[]}}
function mkQ(text,right,wrongs,img){
  var opts=shuffle([right].concat(wrongs));
  return {text:text,opts:opts,correct:opts.indexOf(right),img:img||null};
}
window.onerror=function(m,u,l){var b=$('#errBox');b.style.display='block';b.textContent='Feil: '+m+' (linje '+l+')'};

/* ===== Tilstand ===== */
var view='home';
var S={cats:null,own:true,count:10,secs:20};
var APP_VER='v35'; /* hold lik cache-navnet i sw.js */
var H={views:[],queue:[],turn:0,peer:null,code:'',players:{},phase:'lobby',qs:[],qi:-1,endsAt:0,timer:null,cfg:null,counts:[0,0,0,0],lock:null};
var P={peer:null,conn:null,name:'',code:'',st:null,end:0,chosen:null,joined:false,leaving:false,gen:0,tick:null,status:''};

function go(v){view=v;render()}
function render(){
  var h='';
  if(view==='home')h=vHome();
  else if(view==='editor')h=vEditor();
  else if(view==='setup')h=vSetup();
  else if(view==='themes')h=vThemes();
  else if(view==='host')h=vHost();
  else if(view==='player')h=vPlayer();
  if(view!=='host'||H.phase==='lobby'||H.phase==='end')h+='<p class="ver">Familiequiz '+APP_VER+'</p>';
  app.innerHTML=h;
  window.scrollTo(0,0);
  if(view==='setup'){fillLists();updCounts()}
}

/* ===== Hjem ===== */
/* Mobil er bare for spillere; vert/admin (spørsmål, quizstart) er kun på PC/nettbrett */
/* Adresse med ?admin (eller ?admin=0 for å slå av igjen) åpner admin også på smal skjerm */
if(/[?&]admin=0/.test(location.search))lsSet('fq-admin','');
else if(/[?&]admin/.test(location.search))lsSet('fq-admin','1');
function isPhone(){return !lsGet('fq-admin','')&&window.matchMedia&&window.matchMedia('(max-width:700px)').matches}
function vHome(){
  var kode=(location.search.match(/kode=(\d+)/)||[])[1]||'';
  var n=loadOwn().length;
  return '<div class="wrap"><h1>🎉 Familiequiz</h1><p class="sub">Quiz for venner og familie</p>'+
  '<div class="card"><h2>Bli med i en quiz</h2>'+
  '<input id="jcode" type="tel" inputmode="numeric" maxlength="4" placeholder="Kode (4 siffer)" value="'+esc(kode)+'">'+
  '<input id="jname" type="text" maxlength="14" placeholder="Ditt navn" value="'+esc(lsGet('fq-navn',''))+'">'+
  '<button class="btn" data-a="join">Bli med</button></div>'+
  (isPhone()?'':'<div class="card"><h2>Vær vert (admin)</h2><button class="btn" data-a="new">Start ny quiz</button>'+
  '<button class="btn ghost" data-a="own">Våre egne spørsmål ('+n+')</button></div>'+
  '<p class="note">Verten må la appen stå åpen under hele quizen.</p>')+'</div>';
}

/* ===== Egne spørsmål ===== */
var editIdx=-1,backTo='home';
function vEditor(){
  var own=loadOwn(),e=editIdx>=0?own[editIdx]:null,w=e?e.w:[];
  var h='<div class="wrap">'+adminTabs('editor')+'<div class="cols">';
  h+='<div class="card"><h2>'+(e?'Rediger spørsmål':'Nytt spørsmål')+'</h2>'+
  '<textarea id="eq" rows="2" placeholder="Spørsmålet, f.eks. Hvem er dette på bildet?">'+esc(e?e.t:'')+'</textarea>'+
  '<input id="er" type="text" placeholder="Riktig svar" value="'+esc(e?e.c:'')+'">'+
  '<label class="note" style="display:block;text-align:left">Bilde (valgfritt)'+(e&&e.img?' – har bilde fra før, velg nytt for å bytte':'')+'</label><input id="eimg" type="file" accept="image/*">'+

/* CSV (komma eller semikolon, anførselstegn, evt. BOM) → rader med celler */
function parseCsv(txt){
  txt=txt.replace(/^﻿/,'');
  var first=txt.split(/\r?\n/)[0]||'',d=(first.split(';').length>=first.split(',').length)?';':',';
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<txt.length;i++){
    var ch=txt.charAt(i);
    if(q){
      if(ch==='"'){if(txt.charAt(i+1)==='"'){cell+='"';i++}else q=false}else cell+=ch;
    }else if(ch==='"')q=true;
    else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&txt.charAt(i+1)==='\n')i++;
      row.push(cell);cell='';rows.push(row);row=[];
    }else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows;
}

  im.onload=function(){
    var m=max||560,w=im.width,hh=im.height,s=Math.min(1,m/Math.max(w,hh));

function poolGet(urls,n){
  return new Promise(function(resolve){
    var out=new Array(urls.length),i=0,done=0;
    if(!urls.length)return resolve([]);
    function nx(){
      if(i>=urls.length)return;var k=i++;
      getJson(urls[k],30000).then(function(j){out[k]=j},function(){out[k]=null}).then(function(){done++;if(done===urls.length)resolve(out);else nx()});
    }
    for(var w=0;w<Math.min(n,urls.length);w++)nx();
  });
}

function searchNb(terms,from,to){
  var reqs=[];
  terms.forEach(function(t){for(var p=0;p<6;p++)reqs.push('https://api.nb.no/catalog/v1/items?q='+encodeURIComponent(t)+'&filter=mediatype:bilder&size=50&page='+p)});
  return poolGet(reqs,4).then(function(res){
    if(res.every(function(r){return !r}))throw new Error('ingen svar fra nb.no');
    var seen={},items=[];
    res.forEach(function(d){
      if(!d||!d._embedded||!d._embedded.items)return;
      d._embedded.items.forEach(function(it){
        var m=it.metadata||{},ai=it.accessInfo||{};
        if(ai.accessAllowedFrom&&ai.accessAllowedFrom!=='EVERYWHERE')return;
        var y=yearOf(m.dateCreated);
        if(!y||y<from||y>to)return;
        var title=String(m.title||'').replace(/\s*\[bilde[^\]]*\]\s*/i,' ').replace(/\s+/g,' ').trim();
        if(title.length<8||/^\[/.test(title)||seen[title.toLowerCase()])return;
        seen[title.toLowerCase()]=1;
        var th=it._links&&(it._links.thumbnail_large||it._links.thumbnail_medium);
        if(!th)return;
        items.push({k:'y',y:y,n:title,img:th.href.replace(/\/full\/0,\d+\//,'/full/0,560/'),info:title+(m.creators&&m.creators.length?' · '+m.creators[0]:'')+' · nb.no'});
      });
    });
    return items;
  });
}
function searchDimu(terms,from,to,key){

    '&fq='+encodeURIComponent('artifact.hasPictures:true')+'&fq='+encodeURIComponent('artifact.ingress.production.fromYear:['+from+' TO '+to+']')+'&api.key='+encodeURIComponent(key))});
  return poolGet(reqs,3).then(function(res){
    if(res.every(function(r){return !r}))throw new Error('ingen svar fra DigitaltMuseum – sjekk API-nøkkelen');
    var seen={},items=[];
    res.forEach(function(d){
      var docs=d&&d.response&&d.response.docs||[];
      docs.forEach(function(x){
        var id=x['artifact.defaultMediaIdentifier'],title=x['artifact.ingress.title'],y=parseInt(x['artifact.ingress.production.fromYear'],10);

  });
}
/* Logoer: fjern de som viser tekst (navnet) ved å lese bildet med OCR (Tesseract.js lastes ved behov) */
var TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
function loadScript(src){
  return new Promise(function(res,rej){
    if(window.Tesseract)return res();
    var s=document.createElement('script');s.src=src;s.onload=function(){res()};s.onerror=function(){rej(new Error('kunne ikke laste tekstleseren'))};document.head.appendChild(s);
  });
}
function commonsThumbs(files){
  var batches=[];
  for(var i=0;i<files.length;i+=40)batches.push(files.slice(i,i+40));
  return Promise.all(batches.map(function(b){
    var u='https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=url&iiurlwidth=900&format=json&origin=*&titles='+encodeURIComponent(b.map(function(f){return 'File:'+f}).join('|'));
    return getJson(u,30000).catch(function(){return null});
  })).then(function(rs){
    var m={};
    rs.forEach(function(d){
      if(!d||!d.query||!d.query.pages)return;
      Object.keys(d.query.pages).forEach(function(k){var p=d.query.pages[k];if(p.imageinfo&&p.imageinfo[0])m[p.title.replace(/^File:/,'').replace(/_/g,' ')]=p.imageinfo[0].thumburl});
    });
    return m;
  });
}
function ocrFilter(items,onProgress){
  return Promise.all([loadScript(TESS_URL),commonsThumbs(items.map(function(it){return it.file}))]).then(function(r){
    var thumbs=r[1],keep=new Array(items.length),idx=0,done=0;
    return Promise.all([0,1,2].map(function(){return Tesseract.createWorker('eng')})).then(function(ws){
      return Promise.all(ws.map(function(w){
        return w.setParameters({tessedit_pageseg_mode:'11'}).then(function(){
          function step(){
            if(idx>=items.length)return Promise.resolve();
            var k=idx++,u=thumbs[items[k].file.replace(/_/g,' ')];
            if(!u){done++;return step()}
            function hasText(res){return (res.data.words||[]).some(function(wd){return /[A-Za-zÀ-ÿ]{2,}/.test(wd.text)&&wd.confidence>=20})}
            return fetch(u).then(function(x){return x.blob()}).then(function(b){
              /* to leseformer: spredt tekst (11) og tekstblokk (6); tekst i en av dem fjerner logoen */
              return w.setParameters({tessedit_pageseg_mode:'11'}).then(function(){return w.recognize(b)}).then(function(r1){
                if(hasText(r1)){keep[k]=false;return}
                return w.setParameters({tessedit_pageseg_mode:'6'}).then(function(){return w.recognize(b)}).then(function(r2){keep[k]=!hasText(r2)});
              });
            }).catch(function(){}).then(function(){done++;onProgress(done,items.length);return step()});
          }
          return step();
        });
      })).then(function(){return Promise.all(ws.map(function(w){return w.terminate()}))});
    }).then(function(){return items.filter(function(it,k){return keep[k]})});
  });
}

    nb:'Bilder fra Nasjonalbiblioteket (nb.no). Spørsmålet er «Hvilket år er bildet fra?».',dimu:'Foto fra DigitaltMuseum (digitaltmuseum.no). Krever egen API-nøkkel.'};

      (cc?'?p wdt:P27 wd:'+cc+'. ':'')+(g?'VALUES ?g {wd:'+g+'} ':'')+
      '?p wdt:P106 ?occ; wdt:P31 wd:Q5; wdt:P569 ?dob; wdt:P18 ?img; wdt:P21 ?g; wikibase:sitelinks ?sl. FILTER(?sl>='+fame+' && YEAR(?dob)>='+from+' && YEAR(?dob)<='+to+')} ORDER BY DESC(?sl) LIMIT '+lim+

    (cc&&cp?'?x wdt:'+cp+' wd:'+cc+'. ':'')+'?x wdt:P31 ?t; wdt:'+ip+' ?img; wikibase:sitelinks ?sl. FILTER(?sl>='+fame+')} ORDER BY DESC(?sl) LIMIT '+(lim*2)+

  if(cfg.own)lists.push(shuffle(loadOwn()).map(function(o){var q=mkQ(o.t,o.c,[],o.img);q.own=true;q.info=o.info||'';q.imgs=o.imgs||[];return q}));
  cfg.cats.forEach(function(c){lists.push(shuffle(BANK[c]).map(function(r){return mkQ(r[0],r[1],r.slice(2))}))});
  var qs=[];
  while(qs.length<cfg.count&&lists.some(function(l){return l.length})){
    lists.forEach(function(l){if(l.length&&qs.length<cfg.count)qs.push(l.shift())});
  }
  return shuffle(qs);
}

/* ===== Vert ===== */
function startHost(){
  if(typeof Peer==='undefined'){alert('Fikk ikke lastet PeerJS. Sjekk nettet og prøv igjen.');return}
  var cats=[],themes=[];
  for(var i=0;i<CATS.length;i++)if($('#c'+i).checked)cats.push(CATS[i]);
  allThemes().forEach(function(t,i){if($('#t'+i).checked)themes.push(t[0])});
  var own=$('#cown').checked&&!$('#cown').disabled;
  var lfiles=[];(LISTS||[]).forEach(function(l,i){var e=$('#L'+i);if(e&&e.checked)lfiles.push(l.f)});
  H.cfg={cats:cats,themes:themes,lists:lfiles,own:own,count:parseInt($('#scount').value,10),secs:parseInt($('#ssecs').value,10),mode:$('#smode').value};
  H.qs=buildQs(H.cfg);
  if(!H.qs.length){alert('Velg minst ett tema.');return}
  H.players={};
  $('#openbtn').disabled=true;$('#openbtn').textContent='Åpner rom…';
  openRoom(0);
}
function openRoom(tries){
  var code=String(1000+Math.floor(Math.random()*9000));
  var p=new Peer('familiequiz-'+code);
  p.on('open',function(){
    H.peer=p;H.code=code;H.phase='lobby';H.qi=-1;
    try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){H.lock=l},function(){})}catch(e){}
    go('host');
  });
  p.on('error',function(err){
    if(err.type==='unavailable-id'&&tries<5){try{p.destroy()}catch(e){}openRoom(tries+1)}
    else if(!H.peer){alert('Kunne ikke åpne rom ('+err.type+'). Sjekk nettet.');go('setup')}
  });
  p.on('connection',function(conn){
    conn.on('data',function(m){hostMsg(conn,m)});
    conn.on('close',function(){hostDrop(conn)});
    conn.on('error',function(){hostDrop(conn)});
  });
  p.on('disconnected',function(){try{p.reconnect()}catch(e){}});
}
function ranked(){var a=[];for(var k in H.players)a.push(H.players[k]);a.sort(function(x,y){return y.score-x.score||(x.name<y.name?-1:1)});return a}
function onlineList(){return ranked().filter(function(p){return p.online})}
function allAnswered(){var o=onlineList();if(!o.length)return false;return o.every(function(p){return !!p.ans})}
function answeredCount(){var n=0,o=onlineList();o.forEach(function(p){if(p.ans)n++});return n+' av '+o.length+' har svart'}
/* Svar-side (svar.html): quizmesterens iPhone får riktig svar samtidig som spørsmålet vises */
function svarUrl(){return location.href.split('?')[0].split('#')[0].replace(/[^\/]*$/,'')+'svar.html?kode='+H.code}
function viewState(){
  var q=H.qs[H.qi],s={t:'v',ph:H.phase,n:H.qs.length,i:H.qi+1,players:onlineList().length};
  if(q&&H.phase!=='lobby'&&H.phase!=='end'){
    s.text=q.text;s.ans=q.opts[q.correct];s.info=q.info||'';s.own=!!q.own;s.buzz=H.qmode==='b';
    if(H.phase==='buzz'&&H.queue[H.turn])s.who=H.queue[H.turn].name;
  }
  return s;
}
function sendView(c){try{c.send(viewState())}catch(e){}}
function sendViews(){H.views.forEach(sendView)}
function hostMsg(conn,m){
  if(!m)return;
  if(m.t==='view'){conn._view=true;if(H.views.indexOf(conn)<0)H.views.push(conn);sendView(conn);return}
  if(m.t==='join'){
    var name=String(m.name||'').trim().slice(0,14);
    if(!name){conn.send({t:'err',m:'Skriv et navn.'});return}
    var p=H.players[name];
    if(p&&p.online&&p.conn!==conn){conn.send({t:'err',m:'Navnet er allerede i bruk.'});return}
    if(!p)p=H.players[name]={name:name,score:0,ans:null,last:null};
    p.conn=conn;p.online=true;conn._name=name;
    conn.send({t:'joined',name:name});
    sendTo(p);refreshHost();
  }else if(m.t==='buzz'){
    var bp=H.players[conn._name];
    if(!bp||H.qmode!=='b'||(H.phase!=='q'&&H.phase!=='buzz')||H.locked[bp.name])return;
    for(var bi=0;bi<H.queue.length;bi++)if(H.queue[bi].name===bp.name)return;
    H.queue.push({name:bp.name,at:Date.now()});
    if(H.phase==='q'){H.left=H.endsAt?Math.max(0,H.endsAt-Date.now()):0;H.phase='buzz';H.turn=0;startAnswerTimer()}
    broadcast();render();
  }else if(m.t==='ans'){
    var pl=H.players[conn._name];
    if(!pl)return;
    if(H.qmode==='b'){
      if(H.qs[H.qi].own)return;
      var cur=H.queue[H.turn];
      if(H.phase!=='buzz'||!cur||cur.name!==pl.name)return;
      hostTurnResult((m.c|0)===H.qs[H.qi].correct,false);return;
    }
    if(H.phase!=='q'||pl.ans)return;
    var c=m.c|0,q=H.qs[H.qi],ms=Date.now()-H.qStart,ok=c===q.correct,span=(H.cfg.secs||30)*1000;
    pl.ans={c:c,ok:ok,ms:ms,gain:ok?500+Math.round(500*Math.max(0,1-ms/span)):0};
    conn.send({t:'a',c:c});
    refreshHost();
    if(allAnswered())hostReveal();
  }
}
function hostDrop(conn){
  if(conn._view){H.views=H.views.filter(function(c){return c!==conn});return}
  var p=H.players[conn._name];
  if(p&&p.conn===conn){
    p.online=false;refreshHost();
    if(H.phase==='q'&&H.qmode!=='b'&&allAnswered())hostReveal();
    else if(H.phase==='q')checkBuzzEnd();
    else if(H.phase==='buzz'&&H.queue[H.turn]&&H.queue[H.turn].name===p.name)hostTurnResult(false,true);
  }
}
function checkBuzzEnd(){
  if(H.qmode!=='b'||H.phase!=='q')return false;
  var o=onlineList();
  if(o.length&&o.every(function(p){return H.locked[p.name]})){hostReveal();return true}
  return false;
}
function cdNow(){return H.qmode==='b'?'':(H.phase==='q'&&!H.cfg.secs)?'∞':Math.ceil(Math.max(0,H.endsAt-Date.now())/1000)}
function pcd(){return P.st&&P.st.b?'':P.end?Math.ceil(Math.max(0,P.end-Date.now())/1000):'∞'}
function startTimer(){
  if(H.timer)clearInterval(H.timer);
  H.timer=setInterval(function(){
    var l=Math.max(0,H.endsAt-Date.now()),e=$('#cd');
    if(e)e.textContent=Math.ceil(l/1000);
    if(l<=0){if(H.phase==='buzz')hostTurnResult(false,true);else hostReveal()}
  },250);
}
var ANS_MS=10000;
/* Buzzer: ingen nedtelling. Verten bruker «Hopp over» hvis noen blir sittende. */
function startAnswerTimer(){if(H.timer){clearInterval(H.timer);H.timer=null}H.endsAt=0}
/* Buzzer: spilleren som har tur har svart (ok) eller gått tom for tid (timedOut). */
function hostTurnResult(ok,timedOut){
  if(H.phase!=='buzz')return;
  var cur=H.queue[H.turn];if(!cur)return;
  var p=H.players[cur.name];
  if(ok){
    if(p){p.score+=500;p.bz=(p.bz||0)+500}
    hostReveal();return;
  }
  if(p&&!timedOut){p.score-=100;p.bz=(p.bz||0)-100}
  H.locked[cur.name]=1;H.turn++;
  while(H.queue[H.turn]&&!(H.players[H.queue[H.turn].name]||{}).online){H.locked[H.queue[H.turn].name]=1;H.turn++}
  if(H.queue[H.turn]){startAnswerTimer();broadcast();render();return}
  /* køen er tom: åpne buzzerne igjen for de som ikke har prøvd */
  H.queue=[];H.turn=0;H.phase='q';
  if(checkBuzzEnd())return;
  H.endsAt=0;
  broadcast();render();
}
function fmtD(ms){return '+'+(ms/1000).toFixed(2).replace('.',',')+' s'}
function stateFor(p){
  var q=H.qs[H.qi],r=ranked();
  function top(n){return r.slice(0,n).map(function(x){return {name:x.name,score:x.score}})}
  if(H.phase==='lobby')return {t:'s',ph:'lobby',n:r.length};
  if(H.phase==='q')return {t:'s',ph:'q',b:H.qmode==='b',locked:!!H.locked[p.name],i:H.qi+1,n:H.qs.length,text:q.text,opts:q.opts,img:q.img,left:H.endsAt?Math.max(0,H.endsAt-Date.now()):null,ans:p.ans?p.ans.c:null};
  if(H.phase==='buzz'){
    var cur=H.queue[H.turn],first=H.queue[0],pos=-1,d=0,you=cur.name===p.name;
    H.queue.forEach(function(e,i){if(e.name===p.name){pos=i;d=e.at-first.at}});
    return {t:'s',ph:'buzz',b:true,i:H.qi+1,n:H.qs.length,text:q.text,img:q.img,opts:(you&&!q.own)?q.opts:null,oral:!!q.own,who:cur.name,you:you,pos:pos,turn:H.turn,d:d,locked:!!H.locked[p.name],left:H.endsAt?Math.max(0,H.endsAt-Date.now()):null,
      queue:H.queue.map(function(e){return {name:e.name,d:e.at-first.at}})};
  }
  if(H.phase==='reveal'){var l=p.last||{c:null,gain:0,ok:false};
    return {t:'s',ph:'reveal',i:H.qi+1,n:H.qs.length,text:q.text,opts:q.opts,correct:q.correct,info:q.info||'',own:!!q.own,you:{b:H.qmode==='b',c:l.c,ok:l.ok,gain:l.gain,score:p.score,rank:r.indexOf(p)+1},top:top(5)}}
  return {t:'s',ph:'end',you:{score:p.score,rank:r.indexOf(p)+1},top:top(50)};
}
function sendTo(p){if(p.conn&&p.online){try{p.conn.send(stateFor(p))}catch(e){}}}
function broadcast(){for(var k in H.players)sendTo(H.players[k]);sendViews()}
function refreshHost(){
  sendViews();
  if(view!=='host')return;
  if(H.phase==='q'){
    var e=$('#cnt');if(e)e.textContent=answeredCount();
    var t=$('#times');if(t)t.innerHTML=timesInner(false);
  }else render();
}
/* Musikk: ett Audio-element gjenbrukes (iOS låser det opp ved første trykk, f.eks. «Neste spørsmål»).
   Lyden går dit iPad/PC sender lyd (AirPlay/Bluetooth). */
var AUD=null;
function sndStop(){try{if(AUD){AUD.pause();AUD.currentTime=0}}catch(e){}}
function sndPlay(src){
  try{
    if(!AUD)AUD=new Audio();
    if(src){AUD.src=src}
    AUD.currentTime=0;
    var p=AUD.play();if(p&&p.catch)p.catch(function(){});
  }catch(e){}
}
function sndHtml(q){
  return q&&q.snd?'<div class="row" style="justify-content:center;margin:10px 0"><button class="btn ghost" data-a="snd">🎵 Spill av igjen</button><button class="btn ghost" data-a="sndstop">⏹ Stopp musikk</button></div>':'';
}
function hostNext(){
  if(H.timer){clearInterval(H.timer);H.timer=null}
  sndStop();
  if(H.qi+1>=H.qs.length){H.phase='end'}
  else{
    H.qi++;H.phase='q';H.qmode=H.qs[H.qi].own?'b':H.cfg.mode;H.qStart=Date.now();H.endsAt=(H.cfg.secs&&H.qmode!=='b')?Date.now()+H.cfg.secs*1000:0;H.locked={};H.winner=null;H.queue=[];H.turn=0;
    for(var k in H.players){H.players[k].ans=null;H.players[k].bz=0}
    if(H.endsAt)startTimer();
    if(H.qs[H.qi].snd)sndPlay(H.qs[H.qi].snd);
  }
  broadcast();render();
}
function hostReveal(){
  if(H.phase!=='q'&&H.phase!=='buzz')return;
  if(H.timer){clearInterval(H.timer);H.timer=null}
  sndStop();
  H.phase='reveal';H.counts=[0,0,0,0];H.winner=null;
  for(var k in H.players){
    var p=H.players[k];
    if(H.qmode==='b'){p.last={c:null,ok:(p.bz||0)>0,gain:p.bz||0};continue}
    p.last=p.ans||{c:null,ok:false,gain:0};
    p.score+=p.last.gain;
    if(p.last.c!=null&&p.last.c>=0&&p.last.c<4)H.counts[p.last.c]++;
  }
  broadcast();render();
}
function hostFinish(){
  if(H.phase!=='q'&&H.phase!=='reveal'&&H.phase!=='buzz')return;
  if(H.timer){clearInterval(H.timer);H.timer=null}
  sndStop();
  H.phase='end';broadcast();render();
}
function hostAgain(){
  sndStop();
  for(var k in H.players){H.players[k].score=0;H.players[k].ans=null;H.players[k].last=null}
  H.qs=buildQs(H.cfg);H.qi=-1;H.phase='lobby';broadcast();render();
}
function hostClose(){
  if(H.timer){clearInterval(H.timer);H.timer=null}
  sndStop();
  try{if(H.peer)H.peer.destroy()}catch(e){}
  try{if(H.lock)H.lock.release()}catch(e){}
  H.peer=null;H.players={};H.views=[];H.phase='lobby';go('home');
}

    qDiv(q)+
    '<div class="gl"><div>'+boardHtml()+'</div><div class="mid">'+
    '<div class="card" style="text-align:center;background:rgba(34,197,94,.35)"><div class="big" style="margin:0">🔔 '+esc(cur.name)+' svarer</div><p class="note" style="margin:6px 0 0">'+(H.turn===0?'Trykket først':'Nr. '+(H.turn+1)+' i køen')+(q.own?' – svarer muntlig':' – svarer A–D på mobilen')+'</p></div>'+
    (q.img?'<img class="qimg" style="max-height:'+(q.own?'40vh':'28vh')+'" src="'+q.img+'" alt="">':'')+(q.own?'':optsHtml(q,'q'))+sndHtml(q)+
    '</div>'+queueHtml()+'</div>'+
    (q.own
      ?ctlBar('<button class="btn ok" data-a="approve">✓ Godkjent</button>',
        '<div class="row"><button class="btn ghost" data-a="wrong">✗ Feil svar</button><button class="btn ghost" data-a="skipturn">Hopp over</button><button class="btn ghost" data-a="skip">Vis fasit nå</button></div>',
        '<button class="btn red" data-a="finish">Avslutt quizen nå</button>')
      :ctlBar('<button class="btn ghost" data-a="skip">Vis fasit nå</button>','<button class="btn ghost" data-a="skipturn">Hopp over '+esc(cur.name)+'</button>','<button class="btn red" data-a="finish">Avslutt quizen nå</button>'));
  }else if(H.phase==='reveal'){
    var rhead='<div class="top"><span>Spørsmål '+(H.qi+1)+' av '+H.qs.length+'</span><span></span></div>'+
    qDiv(q);
    var rmid=q.own?infoPage(q):(q.img?'<img class="qimg" src="'+q.img+'" alt="">':'')+optsHtml(q,'reveal')+(q.info?'<p class="sub" style="margin-top:12px;font-size:20px">'+esc(q.info)+'</p>':'')+
    '';
    var last=H.qi+1>=H.qs.length;
    h+=rhead+'<div class="gl"><div>'+boardHtml()+'</div><div class="mid">'+rmid+'</div>'+
      (H.qmode==='b'?(H.queue.length?queueResultHtml():gainsHtml()):'<div class="card" id="times">'+timesInner(true)+'</div>')+'</div>'+
      ctlBar('<button class="btn" data-a="next">'+(last?'Se sluttresultat':'Neste spørsmål')+'</button>',
        last?'':modeToggle('Neste spørsmål spilles som',H.qs[H.qi+1]),
        last?'':'<button class="btn red" data-a="finish">Avslutt quizen nå</button>');
  }else{
    h+='<h1>🏆 Resultat</h1><div class="card">'+scoreRows(r,50)+'</div>'+
    '<button class="btn" data-a="again">Spill igjen (samme gjester)</button><button class="btn red" data-a="close">Avslutt</button>';
  }
  return h+'</div>';
}

/* ===== Spiller ===== */
function doJoin(){
  var code=$('#jcode').value.trim(),name=$('#jname').value.trim();
  if(typeof Peer==='undefined'){alert('Fikk ikke lastet PeerJS. Sjekk nettet og prøv igjen.');return}
  if(!/^\d{4}$/.test(code)){alert('Koden har 4 siffer.');return}
  if(!name){alert('Skriv navnet ditt.');return}
  lsSet('fq-navn',name);
  P.code=code;P.name=name;P.st=null;P.chosen=null;P.joined=false;P.leaving=false;P.status='Kobler til…';
  view='player';render();
  connectPlayer();
}
function stopPlayer(){
  P.gen++;
  if(P.tick){clearInterval(P.tick);P.tick=null}
  try{if(P.conn)P.conn.close()}catch(e){}
  try{if(P.peer)P.peer.destroy()}catch(e){}
  P.conn=null;P.peer=null;
}
function leavePlayer(msg){
  P.leaving=true;stopPlayer();
  if(msg)alert(msg);
  go('home');
}
function connectPlayer(){
  if(P.leaving)return;
  stopPlayer();
  var gen=P.gen,done=false,timeout;
  function bad(msg){
    if(done||gen!==P.gen||P.leaving)return;done=true;clearTimeout(timeout);
    if(!P.joined){leavePlayer(msg)}
    else{P.status='Mistet forbindelsen – prøver igjen…';P.st=P.st;render();setTimeout(connectPlayer,3000)}
  }
  var peer=new Peer();P.peer=peer;
  timeout=setTimeout(function(){bad('Fant ikke rommet. Sjekk koden, og at verten har appen åpen.')},12000);
  peer.on('error',function(e){bad(e.type==='peer-unavailable'?'Fant ikke rommet. Sjekk koden, og at verten har appen åpen.':'Tilkoblingsfeil ('+e.type+').')});
  peer.on('open',function(){
    var c=peer.connect('familiequiz-'+P.code,{reliable:true});P.conn=c;
    c.on('open',function(){clearTimeout(timeout);c.send({t:'join',name:P.name})});
    c.on('data',function(m){if(gen===P.gen)playerMsg(m)});
    c.on('close',function(){bad('Mistet forbindelsen.')});
    c.on('error',function(){bad('Tilkoblingsfeil.')});
  });
}
function playerMsg(m){
  if(!m)return;
  if(m.t==='err'){leavePlayer(m.m);return}
  if(m.t==='joined'){P.joined=true;P.status='';return}
  if(m.t==='a'){P.chosen=m.c;render();return}
  if(m.t==='s'){
    P.st=m;P.status='';
    if(m.ph==='q'||m.ph==='buzz'){
      if(m.ph==='q'){P.buzzed=false;P.chosen=m.ans}
      else{var tk=m.i+':'+m.who;if(tk!==P.turnKey){P.turnKey=tk;P.chosen=null}}
      P.end=m.left==null?0:Date.now()+m.left;
      if(P.tick)clearInterval(P.tick);
      P.tick=setInterval(function(){
        var e=$('#pcd');if(e)e.textContent=pcd();
      },250);
    }else if(P.tick){clearInterval(P.tick);P.tick=null}
    render();
  }
}
function playerBuzz(){
  var s=P.st;
  if(P.buzzed||!s||s.locked)return;
  if(!((s.ph==='q'&&s.b)||(s.ph==='buzz'&&!s.you&&s.pos<0)))return;
  P.buzzed=true;
  try{P.conn.send({t:'buzz'})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}
  render();
}
function playerAnswer(i){
  var s=P.st;
  if(P.chosen!=null||!s)return;
  if(!((s.ph==='q'&&!s.b)||(s.ph==='buzz'&&s.you)))return;
  P.chosen=i;
  try{P.conn.send({t:'ans',c:i})}catch(e){}
  render();
}
function vPlayer(){
  var s=P.st,h='<div class="wrap">';
  if(P.status)h+='<p class="note">'+esc(P.status)+'</p>';
  if(!s||s.ph==='lobby'){
    h+='<h1>Hei, '+esc(P.name)+'!</h1><p class="sub">'+(s?'Du er med. Venter på at verten starter quizen…':'Kobler til…')+'</p>'+
    (s?'<p class="note">'+s.n+' spiller'+(s.n===1?'':'e')+' i rommet</p>':'');
  }else if(s.ph==='q'){
    h+='<div class="top"><span>Spørsmål '+s.i+' av '+s.n+'</span><span class="cd" id="pcd">'+pcd()+'</span></div>'+
    '<div class="q" style="font-size:22px">'+esc(s.text)+'</div>'+(s.img?'<img class="qimg" style="max-height:24vh" src="'+s.img+'" alt="">':'');
    if(s.b){
      h+=s.locked?'<div class="buzzmsg">Du er ute på dette spørsmålet</div>'
        :(P.buzzed?'<div class="buzzmsg">Trykket! Venter på bekreftelse …</div>'
        :'<button class="buzz" data-a="buzz">🔔<br>BUZZ</button>');
      return h+'<button class="btn ghost" data-a="leave" style="margin-top:20px">Forlat quizen</button></div>';
    }
    h+='<div class="opts">';
    for(var i=0;i<s.opts.length;i++){
      h+='<button class="opt o'+i+(P.chosen===i?' mine':(P.chosen!=null?' dim':''))+'" data-a="ans" data-i="'+i+'"'+(P.chosen!=null?' disabled':'')+'><b>'+LETT[i]+'</b><span>'+esc(s.opts[i])+'</span></button>';
    }
    h+='</div>'+(P.chosen!=null?'<p class="big" style="font-size:22px">Svar sendt ✓</p><p class="note">Venter på de andre…</p>':'');
  }else if(s.ph==='buzz'){
    h+='<div class="top"><span>Spørsmål '+s.i+' av '+s.n+'</span><span class="cd" id="pcd">'+pcd()+'</span></div>'+
    '<div class="q" style="font-size:22px">'+esc(s.text)+'</div>'+(s.img?'<img class="qimg" style="max-height:24vh" src="'+s.img+'" alt="">':'');
    if(s.you){
      h+='<div class="buzzmsg win">'+(s.pos===0?'✅ Du trykket først!':'✅ Nå er det din tur!')+'<br><small>'+(s.oral?'Svar høyt – verten godkjenner':'Velg riktig svar')+'</small></div><div class="opts">';
      for(var j=0;s.opts&&j<s.opts.length;j++){
        h+='<button class="opt o'+j+(P.chosen===j?' mine':(P.chosen!=null?' dim':''))+'" data-a="ans" data-i="'+j+'"'+(P.chosen!=null?' disabled':'')+'><b>'+LETT[j]+'</b><span>'+esc(s.opts[j])+'</span></button>';
      }
      h+='</div>'+(P.chosen!=null?'<p class="note">Svar sendt …</p>':'');
    }else if(s.locked){
      h+='<div class="buzzmsg">❌ Du er ute på dette spørsmålet<br><small>'+esc(s.who)+' svarer nå</small></div>';
    }else if(s.pos>=0){
      h+='<div class="buzzmsg">🔔 Du er nr. '+(s.pos+1)+' i køen<br><small>'+(s.pos===0?'':fmtD(s.d)+' etter første · ')+esc(s.who)+' svarer nå</small></div>';
    }else{
      h+='<div class="buzzmsg">'+esc(s.who)+' svarer …<br><small>Trykk for å stille deg i køen</small></div><button class="buzz" data-a="buzz">🔔<br>BUZZ</button>';
    }
  }else if(s.ph==='reveal'){
    var y=s.you,gtxt=(y.gain>0?'+':'')+y.gain+' poeng';
    h+='<div class="big '+(y.ok?'ok':'no')+'">'+(y.b?(y.gain>0?'✓ Riktig!':(y.gain<0?'✗ Feil':'Ingen poeng')):(y.c==null?'⏱ Ikke svart':(y.ok?'✓ Riktig!':'✗ Feil')))+'</div>'+
    '<p class="sub" style="font-size:22px">'+gtxt+'</p>'+
    '<div class="card"><p class="note" style="margin:0">Riktig svar</p><div class="q" style="margin:4px 0 0;font-size:24px">'+(s.own?'':LETT[s.correct]+'. ')+esc(s.opts[s.correct])+'</div>'+(s.info?(s.own?'<p style="margin:10px 0 0;font-size:18px;line-height:1.4;text-align:left">'+esc(s.info).replace(/\n/g,'<br>')+'</p>':'<p class="note" style="margin:4px 0 0">'+esc(s.info)+'</p>'):'')+'</div>'+
    '<div class="card"><h2>Du er nr. '+y.rank+' med '+y.score+' poeng</h2>'+scoreRows(s.top,5)+'</div>'+
    '<p class="note">Venter på neste spørsmål…</p>';
  }else{
    h+='<h1>'+(s.you.rank===1?'🏆 Du vant!':'Ferdig!')+'</h1><p class="sub">Du ble nr. '+s.you.rank+' med '+s.you.score+' poeng</p>'+
    '<div class="card">'+scoreRows(s.top,50)+'</div>';
  }
  return h+'<button class="btn ghost" data-a="leave" style="margin-top:20px">Forlat quizen</button></div>';
}

/* ===== Klikk ===== */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  var a=b.getAttribute('data-a'),i=parseInt(b.getAttribute('data-i'),10);
  if(a==='join')doJoin();
  else if(a==='new')go('setup');
  else if(a==='own'){backTo=view;editIdx=-1;go('editor')}
  else if(a==='back')go(backTo)
  else if(a==='tab'){editIdx=-1;TR.replaceId=null;TR.items=[];go(b.getAttribute('data-v'))}
  else if(a==='search')runSearch();
  else if(a==='edittheme')rerunTheme(i,true);
  else if(a==='rerun')rerunTheme(i);
  else if(a==='savenew')saveTheme(true);
  else if(a==='rmres'){TR.items.splice(i,1);renderRes()}
  else if(a==='savetheme')saveTheme();
  else if(a==='deltheme'){if(confirm('Slette temaet?')){var ts=loadThemes();ts.splice(i,1);lsSet('fq-temaer',JSON.stringify(ts));render()}}
  else if(a==='editq'){editIdx=i;render()}
  else if(a==='cancelq'){editIdx=-1;render()}
  else if(a==='home')go('home');
  else if(a==='saveq')saveQ();
  else if(a==='delq'){if(confirm('Slette spørsmålet?')){var o=loadOwn();o.splice(i,1);lsSet(OWN_KEY,JSON.stringify(o));editIdx=-1;render()}}
  else if(a==='open')startHost();
  else if(a==='start')hostNext();
  else if(a==='skip')hostReveal();
  else if(a==='snd'){var sq=H.qs[H.qi];if(sq&&sq.snd)sndPlay(sq.snd)}
  else if(a==='sndstop')sndStop();
  else if(a==='next')hostNext();
  else if(a==='again')hostAgain();
  else if(a==='finish'){if(confirm('Avslutte quizen nå? Alle får se sluttresultatet. Spørsmålet som pågår teller ikke med.'))hostFinish()}
  else if(a==='close'){if(confirm('Avslutte quizen for alle?'))hostClose()}
  else if(a==='share'){
    var u=location.href.split('?')[0].split('#')[0]+'?kode='+H.code;
    if(navigator.share)navigator.share({title:'Familiequiz',text:'Bli med i quizen! Kode: '+H.code,url:u}).catch(function(){});
    else prompt('Kopier lenken:',u);
  }
  else if(a==='sharesvar'){
    var su=svarUrl();
    if(navigator.share)navigator.share({title:'Familiequiz – svar',text:'Riktig svar til quizmester. Kode: '+H.code,url:su}).catch(function(){});
    else prompt('Kopier lenken:',su);
  }
  else if(a==='ans')playerAnswer(i);
  else if(a==='buzz')playerBuzz();
  else if(a==='setmode'){H.cfg.mode=b.getAttribute('data-v');render()}
  else if(a==='skipturn')hostTurnResult(false,true);
  else if(a==='approve')hostTurnResult(true,false);
  else if(a==='wrong')hostTurnResult(false,false);
  else if(a==='leave'){if(confirm('Forlate quizen?'))leavePlayer()}
  else if(a==='reloadlists'){
    KEEP=[];(LISTS||[]).forEach(function(l,i){var e=$('#L'+i);if(e&&e.checked)KEEP.push(l.f)});
    LISTS=null;fillLists();
  }
  else if(a==='openall')setAllOpen(true);
  else if(a==='closeall')setAllOpen(false);
});
app.addEventListener('toggle',function(e){
  var d=e.target;if(!d.classList||!d.classList.contains('dt'))return;
  var s=openSt();s[d.getAttribute('data-k')]=d.open;lsSet('fq-open',JSON.stringify(s));
},true);

app.addEventListener('change',function(e){
  if(view==='setup'&&e.target.type==='checkbox')updCounts();
  if(e.target.id==='tsrc')setSrc(e.target.value);
  if(e.target.id==='ttype'){var tv=e.target.value;$('#tpers').style.display=tv==='p'?'':'none';$('#tcatrow').style.display=tv==='k'?'':'none';$('#tfame').value=tv==='l'?'2':'1'}
});
$('#refreshBtn').addEventListener('click',function(){
  if((H.peer||P.joined)&&!confirm('Oppdatere appen? Du blir koblet fra quizen og må bli med igjen.'))return;
  var go2=function(){location.reload()};
  try{
    var jobs=[];
    if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));
    if(window.caches)jobs.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));
    Promise.all(jobs).then(go2,go2);
  }catch(e){go2()}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
</script>
