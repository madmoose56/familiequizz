<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Familiequiz svar">
<meta name="theme-color" content="#2e1065">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Familiequiz – riktig svar</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:linear-gradient(160deg,#1e1b4b,#4c1d95 60%,#7e22ce);background-attachment:fixed;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:6px 0 4px;text-align:center}
.sub{opacity:.8;text-align:center;margin:0 0 14px}
.card{background:rgba(255,255,255,.12);border-radius:16px;padding:16px;margin-bottom:14px}
input{width:100%;font-size:22px;padding:14px;border-radius:12px;border:0;margin:6px 0;text-align:center;font-family:inherit}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:18px;font-weight:700;color:#3b0764;background:#fde047;margin:8px 0 0;cursor:pointer;font-family:inherit}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.top{display:flex;justify-content:space-between;font-size:17px;opacity:.9;margin-bottom:10px}
.q{font-size:21px;font-weight:700;line-height:1.3}
.ans{background:rgba(34,197,94,.35);text-align:center;padding:22px 14px}
.ans .lbl{font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.85}
.ans .a{font-size:38px;font-weight:800;color:#dcfce7;line-height:1.15;margin-top:6px;word-break:break-word}
.info{font-size:17px;line-height:1.45;text-align:left}
.stat{text-align:center;font-size:19px;font-weight:700;border-radius:14px;padding:14px;background:rgba(255,255,255,.14);margin-bottom:14px}
.stat.who{background:rgba(250,204,21,.3)}
.note{font-size:14px;opacity:.7;text-align:center}
.ver{text-align:center;font-size:12px;opacity:.55;margin:22px 0 4px}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var APP_VER='v33'; /* hold lik versjonen i index.html og sw.js */
var app=document.getElementById('app');
var S={code:'',st:null,peer:null,conn:null,gen:0,joined:false,leaving:true,status:'',key:''};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var wl=null;
function keepAwake(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l},function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!S.leaving)keepAwake()});

function render(){
  var s=S.st,h='';
  if(S.status)h+='<p class="note">'+esc(S.status)+'</p>';
  if(S.leaving){
    var kode=(location.search.match(/kode=(\d+)/)||[])[1]||lsGet('fq-svarkode','');
    h+='<h1>🎙️ Riktig svar</h1><p class="sub">For quizmesteren. Du ser svaret samtidig som spørsmålet vises på TV-en.</p>'+
    '<div class="card"><input id="code" type="tel" inputmode="numeric" maxlength="4" placeholder="Rommets kode (4 siffer)" value="'+esc(kode)+'">'+
    '<button class="btn" id="go">Koble til</button></div>';
  }else if(!s){
    h+='<h1>Kobler til …</h1><p class="sub">Rom '+esc(S.code)+'</p><button class="btn ghost" id="leave">Avbryt</button>';
  }else{
    var run=s.ph==='q'||s.ph==='buzz'||s.ph==='reveal';
    h+='<div class="top"><span>🎙️ Rom '+esc(S.code)+'</span><span>'+(run?'Spørsmål '+s.i+' av '+s.n:s.players+' spillere')+'</span></div>';
    if(s.ph==='lobby'){
      h+='<div class="stat">Venter på at quizen starter …</div><p class="note">Riktig svar vises her så snart første spørsmål kommer opp på TV-en.</p>';
    }else if(s.ph==='end'){
      h+='<div class="stat">🏆 Quizen er ferdig</div>';
    }else{
      var st=s.ph==='reveal'?'Fasit er vist – venter på neste spørsmål'
        :(s.ph==='buzz'?'🔔 '+esc(s.who||'')+' svarer nå':(s.buzz?'🔔 Venter på at noen trykker BUZZ':'Spillerne svarer A–D på mobilen'));
      h+='<div class="card"><div class="q">'+esc(s.text)+'</div></div>'+
      '<div class="card ans pop" id="ansbox"><div class="lbl">Riktig svar</div><div class="a">'+esc(s.ans)+'</div></div>'+
      '<div class="stat'+(s.ph==='buzz'?' who':'')+'">'+st+'</div>'+
      (s.info?'<div class="card info">'+esc(s.info).replace(/\n/g,'<br>')+'</div>':'');
    }
    h+='<button class="btn ghost" id="leave" style="margin-top:18px">Bytt rom / koble fra</button>';
  }
  h+='<p class="ver">Familiequiz '+APP_VER+'</p>';
  app.innerHTML=h;
  var go=document.getElementById('go');if(go)go.onclick=start;
  var lv=document.getElementById('leave');if(lv)lv.onclick=function(){stop();S.leaving=true;S.st=null;S.status='';render()};
}
function stop(){
  S.gen++;
  try{if(S.conn)S.conn.close()}catch(e){}
  try{if(S.peer)S.peer.destroy()}catch(e){}
  S.conn=null;S.peer=null;
}
function start(){
  var code=document.getElementById('code').value.trim();
  if(typeof Peer==='undefined'){alert('Fikk ikke lastet PeerJS. Sjekk nettet og prøv igjen.');return}
  if(!/^\d{4}$/.test(code)){alert('Koden har 4 siffer.');return}
  lsSet('fq-svarkode',code);
  S.code=code;S.st=null;S.joined=false;S.leaving=false;S.status='';
  keepAwake();render();connect();
}
function connect(){
  if(S.leaving)return;
  stop();
  var gen=S.gen,done=false,timeout;
  function bad(msg){
    if(done||gen!==S.gen||S.leaving)return;done=true;clearTimeout(timeout);
    if(!S.joined){stop();S.leaving=true;S.status=msg;render()}
    else{S.status='Mistet forbindelsen – prøver igjen …';render();setTimeout(connect,3000)}
  }
  var peer=new Peer();S.peer=peer;
  timeout=setTimeout(function(){bad('Fant ikke rommet. Sjekk koden, og at verten har appen åpen.')},12000);
  peer.on('error',function(e){bad(e.type==='peer-unavailable'?'Fant ikke rommet. Sjekk koden, og at verten har appen åpen.':'Tilkoblingsfeil ('+e.type+').')});
  peer.on('open',function(){
    var c=peer.connect('familiequiz-'+S.code,{reliable:true});S.conn=c;
    c.on('open',function(){clearTimeout(timeout);S.joined=true;S.status='';c.send({t:'view'})});
    c.on('data',function(m){
      if(gen!==S.gen||!m||m.t!=='v')return;
      S.st=m;S.status='';
      if(navigator.vibrate&&m.text!==undefined&&(!S.key||S.key!==m.i+':'+m.text)&&m.ph==='q'){try{navigator.vibrate(80)}catch(e){}}
      S.key=m.i+':'+(m.text||'');
      render();
    });
    c.on('close',function(){bad('Mistet forbindelsen.')});
    c.on('error',function(){bad('Tilkoblingsfeil.')});
  });
}
render();
if(/[?&]kode=\d{4}/.test(location.search)&&typeof Peer!=='undefined'){document.getElementById('go')&&start()}
</script>
</body>
</html>
